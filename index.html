<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EQSANS Machine Physics Summary</title>
<style>
  :root{
    --green:#00703c; --green-d:#00522b; --blue:#0067b9;
    --bg:#ffffff; --bg2:#f4f6f7; --bg3:#eceef1; --line:#d3d7dc;
    --text:#1f2328; --muted:#5b6570; --warn:#8a5a00;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Helvetica Neue",Arial,"Segoe UI",system-ui,sans-serif;
    font-size:15px;line-height:1.5}
  a{color:var(--blue);text-decoration:none}
  a:hover{text-decoration:underline}
  .bar{max-width:1400px;margin:0 auto;padding:0 22px;display:flex;
    align-items:center;gap:18px;flex-wrap:wrap}
  header{position:sticky;top:0;z-index:20}
  .masthead{background:var(--green);color:#fff;border-bottom:3px solid var(--green-d)}
  .masthead .bar{padding:12px 22px}
  .brand .title{font-size:19px;font-weight:400;letter-spacing:.2px}
  .brand .title b{font-weight:700}
  .brand .tagline{font-size:12px;opacity:.85;margin-top:1px}
  .spacer{flex:1}
  .selwrap{display:flex;align-items:center;gap:8px}
  .selwrap label{font-size:12px;text-transform:uppercase;letter-spacing:.5px;opacity:.9}
  select{background:#fff;color:var(--text);border:1px solid var(--green-d);
    border-radius:3px;padding:7px 10px;font-size:14px;min-width:150px}
  .subnav{background:var(--bg2);border-bottom:1px solid var(--line)}
  .subnav .bar{padding:0 22px}
  .tabs{display:flex;gap:2px}
  .tabs button{background:none;border:0;border-bottom:3px solid transparent;
    padding:11px 18px;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer}
  .tabs button:hover{color:var(--text)}
  .tabs button.active{color:var(--green);border-bottom-color:var(--green)}
  main{max-width:1400px;margin:0 auto;padding:22px 22px 70px}
  .cyclehead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:3px}
  .cyclehead h2{margin:0;font-size:24px;font-weight:600}
  .badge{font-size:12px;padding:2px 9px;border-radius:3px;border:1px solid var(--line);
    color:var(--muted);background:var(--bg2)}
  .badge.latest{color:#fff;background:var(--green);border-color:var(--green);font-weight:600}
  .badge.warn{color:var(--warn);border-color:#d8c48a;background:#fbf3dc}
  .sub{color:var(--muted);font-size:13px;margin:2px 0 22px}
  .grid{display:flex;flex-direction:column;gap:16px}
  .card{background:var(--bg);border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .card h3{margin:0;padding:11px 16px;font-size:13.5px;font-weight:700;letter-spacing:.3px;
    color:var(--text);background:var(--bg2);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:9px}
  .card h3 .dot{width:9px;height:9px;border-radius:2px;background:var(--green)}
  .card .body{padding:2px 0}
  .filerow{padding:11px 16px;border-bottom:1px solid var(--bg3);display:flex;
    flex-direction:column;gap:5px}
  .filerow:last-child{border-bottom:0}
  .fileline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .filetag{font-size:11px;padding:1px 7px;border-radius:3px;background:var(--bg3);
    border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .filename{font-weight:600;font-size:14px;word-break:break-all}
  .filemeta{color:var(--muted);font-size:12px}
  .pathrow{display:flex;align-items:stretch;margin-top:2px}
  .path{flex:1;font-family:var(--mono);font-size:11.5px;color:#33383e;background:var(--bg2);
    border:1px solid var(--line);border-right:0;border-radius:3px 0 0 3px;padding:6px 9px;
    overflow-x:auto;white-space:nowrap}
  .copy{border:1px solid var(--line);background:#fff;color:var(--muted);
    border-radius:0 3px 3px 0;padding:0 12px;cursor:pointer;font-size:12px}
  .copy:hover{color:var(--text);background:var(--bg2)}
  .copy.ok{color:var(--green);border-color:var(--green)}
  table.vars{width:100%;border-collapse:collapse}
  table.vars td{padding:9px 16px;border-bottom:1px solid var(--bg3);font-size:14px}
  table.vars tr:last-child td{border-bottom:0}
  table.vars td:first-child{color:var(--muted)}
  table.vars td:last-child{text-align:right;font-family:var(--mono);font-weight:600}
  .scalecomp{font-family:var(--mono);color:var(--green)}
  .empty{padding:14px 16px;color:var(--muted);font-size:13px;font-style:italic}
  /* reduction-config code block */
  .codecard{margin-top:18px}
  .codehead{display:flex;align-items:center;gap:9px}
  .codehead .grow{flex:1}
  .copyall{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:3px;
    padding:4px 13px;cursor:pointer;font-size:12px;font-weight:600}
  .copyall:hover{color:var(--text);background:var(--bg)}
  .copyall.ok{color:var(--green);border-color:var(--green)}
  pre.code{margin:0;padding:14px 16px;background:#fbfcfc;font-family:var(--mono);
    font-size:12.5px;line-height:1.6;color:var(--text);overflow-x:auto;white-space:pre}
  /* details */
  .plotgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .plotcard{background:var(--bg);border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .plotcard .cap{padding:8px 12px;font-size:12px;color:var(--muted);background:var(--bg2);
    border-bottom:1px solid var(--line);font-family:var(--mono);word-break:break-all}
  .plotcard img{display:block;width:100%;height:auto;background:#fff;cursor:zoom-in}
  .sectitle{margin:28px 0 14px;font-size:15px;font-weight:700;color:var(--text);
    letter-spacing:.2px;border-bottom:2px solid var(--green);padding-bottom:7px}
  .fluxbox{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:14px}
  .fluxbox svg{width:100%;height:auto;display:block}
  /* standards */
  .stdgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
  .stdcard{background:var(--bg);border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .stdcard .cap{padding:9px 14px;background:var(--bg2);border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .stdcard .cap b{font-size:14px}
  .stdcard .cap .cfg{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .stdinfo{padding:7px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--bg3);
    display:flex;gap:14px;flex-wrap:wrap}
  .stdinfo b{color:var(--text);font-weight:600}
  .stdpair{display:flex;flex-wrap:wrap}
  .stdpair > div{flex:1 1 200px;min-width:0}
  .stdpair .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;
    padding:6px 10px 0}
  .stdpair svg{width:100%;height:auto;display:block;padding:4px 8px 8px}
  .stdpair img{width:100%;height:auto;display:block;background:#fff;cursor:zoom-in}
  .stdpair .div2d{border-left:1px solid var(--bg3)}
  .ovbox{padding:6px 10px 12px}
  .ovbox svg{width:100%;height:auto;display:block}
  .stderr{margin:6px 10px 10px;padding:7px 10px;font-size:12px;color:var(--warn);
    background:#fbf3dc;border:1px solid #e6d09a;border-radius:4px}
  /* masks */
  .maskinfo{padding:4px 14px}
  .mrow{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--bg3);font-size:13px}
  .mrow:last-child{border-bottom:0}
  .mk{color:var(--muted);flex:0 0 140px}
  .mv{font-family:var(--mono);font-size:12px;word-break:break-all;color:var(--text)}
  .maskimg{padding:10px 12px 14px}
  .maskimg img{max-width:100%;height:auto;display:block;background:#fff;cursor:zoom-in;
    border:1px solid var(--line);border-radius:4px}
  .readme{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 22px}
  .readme h1,.readme h2,.readme h3{border-bottom:1px solid var(--line);padding-bottom:6px}
  .readme h1{font-size:21px}.readme h2{font-size:18px}.readme h3{font-size:15px}
  .readme code{font-family:var(--mono);background:var(--bg2);padding:1px 5px;border-radius:3px;font-size:12.5px}
  .readme pre{background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:12px;overflow-x:auto}
  .readme pre code{background:none;padding:0}
  .readme table{border-collapse:collapse;margin:12px 0;display:block;overflow-x:auto}
  .readme th,.readme td{border:1px solid var(--line);padding:6px 10px;font-size:13px}
  .readme th{background:var(--bg2)}
  .readme blockquote{border-left:3px solid var(--green);margin:0;padding-left:14px;color:var(--muted)}
  .readme img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:4px;background:#fff;display:block;margin:12px 0}
  .lightbox{position:fixed;inset:0;background:#000a;display:none;align-items:center;
    justify-content:center;z-index:50;padding:24px}
  .lightbox.on{display:flex}
  .lightbox img{max-width:96vw;max-height:92vh;background:#fff;border-radius:4px}
  footer{max-width:1400px;margin:0 auto;padding:18px 22px;color:var(--muted);font-size:12px;
    border-top:1px solid var(--line)}
  footer code{font-family:var(--mono)}
  footer .org{color:var(--text);font-weight:600}
  .mutelink{color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="masthead">
    <div class="bar">
      <div class="brand">
        <div class="title">EQSANS <b>Machine Physics</b></div>
        <div class="tagline">Spallation Neutron Source &middot; Beam Line 6 &middot; per-cycle calibration summary</div>
      </div>
      <div class="spacer"></div>
      <div class="selwrap">
        <label for="cycle">Cycle</label>
        <select id="cycle"></select>
      </div>
    </div>
  </div>
  <nav class="subnav">
    <div class="bar">
      <div class="tabs" id="tabs">
        <button data-view="summary" class="active">Summary</button>
        <button data-view="details">Details</button>
        <button data-view="standards">Standards</button>
        <button data-view="masks">Masks</button>
        <button data-view="choppers">Choppers</button>
      </div>
    </div>
  </nav>
</header>

<main id="main"></main>

<footer>
  <span class="org">Oak Ridge National Laboratory</span> &middot; Spallation Neutron Source, EQSANS<br>
  <span id="genstamp"></span> &nbsp;·&nbsp;
  Source folder <code id="rootpath"></code> &nbsp;·&nbsp;
  Regenerate with <code>python3 doc/generate.py</code> (or the
  <code>update-mp-page</code> skill).
</footer>

<div class="lightbox" id="lightbox"><img id="lbimg" alt=""></div>

<script src="data.js"></script>
<script>
"use strict";
const D = window.EQSANS_DATA || {cycles:[]};
const byId = Object.fromEntries(D.cycles.map(c => [c.id, c]));
let current = D.cycles[0] ? D.cycles[0].id : null;
let view = "summary";

/* ---------- small helpers ---------- */
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html != null) e.innerHTML = html;
  return e;
}
function esc(s){return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function num(x, dp){return (x==null||isNaN(x))?"—":Number(x).toFixed(dp);}

function pathRow(p){
  const wrap = el("div","pathrow");
  const path = el("div","path", esc(p));
  path.title = p;
  const btn = el("button","copy","copy");
  btn.onclick = () => {
    navigator.clipboard.writeText(p).then(()=>{
      btn.textContent="copied"; btn.classList.add("ok");
      setTimeout(()=>{btn.textContent="copy";btn.classList.remove("ok");},1200);
    });
  };
  wrap.append(path, btn);
  return wrap;
}

function fileRow(f, tag){
  const row = el("div","filerow");
  const line = el("div","fileline");
  if(tag) line.append(el("span","filetag", esc(tag)));
  line.append(el("span","filename", esc(f.name)));
  const meta = [];
  if(f.run) meta.push("run "+f.run);
  if(f.size_h) meta.push(f.size_h);
  if(f.mtime) meta.push(f.mtime);
  if(meta.length) line.append(el("span","filemeta", esc(meta.join("  ·  "))));
  row.append(line, pathRow(f.path));
  return row;
}

function card(title, node, dotColor){
  const c = el("div","card");
  const h = el("h3","", "<span class='dot'></span>"+esc(title));
  if(dotColor) h.querySelector(".dot").style.background = dotColor;
  c.append(h);
  const body = el("div","body");
  body.append(node);
  c.append(body);
  return c;
}

function distLabel(m){
  if(m==null) return "";
  return (m % 1 === 0 ? m.toFixed(0) : m.toString().replace(".","."))+" m";
}

/* ---------- reduction-config code block ---------- */
// Distance token as it appears in the file name (4m, 2o5m, 1o3m ...).
function distToken(f){
  const m = f.name.match(/_(\d+(?:o\d+)?m)_/i);
  if(m) return m[1];
  if(f.distance!=null){
    const d=f.distance;
    return (Number.isInteger(d) ? d : String(d).replace(".","o"))+"m";
  }
  return "x";
}
function floodVar(f, dup){
  const t = distToken(f);
  const mat = (f.name.match(/(thinPMMA|5mmPMMA|1mmH2O|PMMA|H2O)/i)||[])[1];
  // Only qualify with the flood material when a distance is ambiguous.
  return (dup.has(t) && mat) ? ("FLOOD_"+mat+"_"+t) : ("FLOOD_"+t);
}
// Build a python-style config block that can be pasted into a reduction script.
function reductionConfig(c){
  const q = s => '"'+s+'"';
  const out = ["# "+c.id+" configuration"];

  const pairs = [];
  if(c.dark_current.length) pairs.push(["DARK_CURRENT", c.dark_current[0].path]);
  const toks = c.sensitivity.map(distToken);
  const dup = new Set(toks.filter((t,i)=>toks.indexOf(t)!==i));
  c.sensitivity.forEach(f => pairs.push([floodVar(f,dup), f.path]));
  const pf = c.flux.find(f=>f.primary) || c.flux[0];
  if(pf) pairs.push(["FLUX_FILE", pf.path]);
  if(pairs.length){
    const w = Math.max(...pairs.map(p=>p[0].length));
    pairs.forEach(([k,v]) => out.push(k.padEnd(w)+" = "+q(v)));
  }

  out.push("");
  const a = c.agbe || {};
  const hasAgbe = a && (a.scale_y!=null || a.scale_all!=null || a.detoffset!=null || a.scalecomp);
  if(hasAgbe){
    const val = (x, todo) => x!=null ? String(x)
                 : ("None"+(todo ? "   # TODO: "+todo : ""));
    const inprog = a.partial ? "AgBe calibration in progress" : null;
    const rows = [
      ["scale_y",   val(a.scale_y, inprog)],
      ["scale_all", val(a.scale_all, inprog)],
      ["scalecomp", "[scale_all, scale_all * scale_y, 1]"],
      ["samoffset", val(a.samoffset, a.samoffset==null ? "measured at beamline" : null)],
      ["detoffset", val(a.detoffset, inprog)],
    ];
    const w = Math.max(...rows.map(r=>r[0].length));
    rows.forEach(([k,v]) => out.push(k.padEnd(w)+" = "+v));
  } else {
    out.push("# (no AgBe calibration on record for this cycle)");
  }
  return out.join("\n");
}
function codeCard(title, code){
  const c = el("div","card codecard");
  const h = el("h3","codehead");
  h.append(el("span","dot"));
  const t = el("span","grow"); t.textContent = title; h.append(t);
  const btn = el("button","copyall","copy");
  btn.onclick = () => navigator.clipboard.writeText(code).then(()=>{
    btn.textContent="copied"; btn.classList.add("ok");
    setTimeout(()=>{btn.textContent="copy";btn.classList.remove("ok");},1200);
  });
  h.append(btn);
  c.append(h);
  const pre = el("pre","code"); pre.textContent = code; c.append(pre);
  return c;
}

/* ---------- summary view ---------- */
function renderSummary(c){
  const wrap = el("div");

  // Dark current
  const dc = el("div");
  if(c.dark_current.length){
    // primary + extras
    c.dark_current.forEach((f,i)=> dc.append(fileRow(f, i===0?"primary":"alt")));
  } else dc.append(el("div","empty","No dark-current file found."));

  // Sensitivity
  const sn = el("div");
  if(c.sensitivity.length){
    c.sensitivity.forEach(f => sn.append(fileRow(f, distLabel(f.distance))));
  } else sn.append(el("div","empty","No sensitivity files found."));

  // Flux
  const fx = el("div");
  if(c.flux.length){
    c.flux.forEach(f => fx.append(fileRow(f, f.primary?"primary":(f.subdir||"alt"))));
  } else fx.append(el("div","empty","No flux spectrum file found."));

  // AgBe instrument variables
  const av = el("div");
  const a = c.agbe;
  if(a && (a.scale_y!=null || a.detoffset!=null || a.scalecomp || a.note)){
    const t = el("table","vars");
    const rows = [
      ["scale_y", num(a.scale_y,6)],
      ["scale_all", num(a.scale_all,6)],
      ["detoffset", num(a.detoffset,3)],
      ["samoffset", a.samoffset!=null?num(a.samoffset,1):"—"],
    ];
    rows.forEach(([k,v])=>{
      const tr = el("tr");
      tr.append(el("td","",esc(k)), el("td","",esc(v)));
      t.append(tr);
    });
    if(a.scalecomp){
      const tr = el("tr");
      tr.append(el("td","","scalecomp"),
        el("td","","<span class='scalecomp'>["+a.scalecomp.map(x=>num(x,6)).join(", ")+"]</span>"));
      t.append(tr);
    }
    av.append(t);
    const src = [];
    if(a.ipts) src.push("IPTS-"+a.ipts);
    if(a.source) src.push(a.source);
    if(a.partial) src.push("calibration in progress");
    if(a.note) av.append(el("div","empty",esc(a.note)));
    if(src.length) av.append(el("div","empty",esc(src.join("  ·  "))));
  } else {
    av.append(el("div","empty","No AgBe calibration results for this cycle."));
  }

  const grid = el("div","grid");
  grid.append(
    card("Dark current", dc, "#b3453b"),
    card("Sensitivity (flood)", sn, "#1f6fb2"),
    card("Flux spectrum", fx, "#00703c"),
    card("AgBe instrument variables", av, "#b26a00"),
  );
  wrap.append(grid);
  wrap.append(codeCard(c.id+" — reduction config (copy-paste)", reductionConfig(c)));
  return wrap;
}

/* ---------- details view ---------- */
function fluxSVG(fc){
  // log-linear line plot in inline SVG. Y is log10(intensity), X linear (wavelength).
  const W=760, H=340, m={l:64,r:16,t:14,b:44};
  const xs=fc.x, ys=fc.y;
  const pos = ys.map(v=>v>0?v:NaN);
  const xmin=Math.min(...xs), xmax=Math.max(...xs);
  const ln = pos.filter(v=>!isNaN(v)).map(v=>Math.log10(v));
  const ymin=Math.min(...ln), ymax=Math.max(...ln);
  const px = x => m.l + (x-xmin)/(xmax-xmin)*(W-m.l-m.r);
  const py = v => m.t + (1-(Math.log10(v)-ymin)/(ymax-ymin))*(H-m.t-m.b);
  let d="";
  xs.forEach((x,i)=>{ if(pos[i]>0){ d += (d?"L":"M")+px(x).toFixed(1)+" "+py(pos[i]).toFixed(1)+" "; }});
  // axes ticks
  let ticks="";
  for(let e=Math.ceil(ymin); e<=Math.floor(ymax); e++){
    const y=m.t+(1-(e-ymin)/(ymax-ymin))*(H-m.t-m.b);
    ticks+=`<line x1="${m.l}" y1="${y}" x2="${W-m.r}" y2="${y}" stroke="#e3e6e9"/>`;
    ticks+=`<text x="${m.l-8}" y="${y+4}" fill="#5b6570" font-size="11" text-anchor="end">1e${e}</text>`;
  }
  const nx=6;
  for(let i=0;i<=nx;i++){
    const xv=xmin+(xmax-xmin)*i/nx, x=px(xv);
    ticks+=`<line x1="${x}" y1="${m.t}" x2="${x}" y2="${H-m.b}" stroke="#eef0f2"/>`;
    ticks+=`<text x="${x}" y="${H-m.b+18}" fill="#5b6570" font-size="11" text-anchor="middle">${xv.toFixed(1)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">
    <rect x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="#fbfcfc" stroke="#d3d7dc"/>
    ${ticks}
    <path d="${d}" fill="none" stroke="#00703c" stroke-width="1.8"/>
    <text x="${W/2}" y="${H-8}" fill="#5b6570" font-size="12" text-anchor="middle">wavelength (Å)</text>
    <text x="16" y="${H/2}" fill="#5b6570" font-size="12" text-anchor="middle" transform="rotate(-90 16 ${H/2})">intensity (a.u.)</text>
  </svg>`;
}

function renderDetails(c){
  const wrap = el("div");

  if(c.flux_curve && c.flux_curve.x && c.flux_curve.x.length){
    wrap.append(el("div","sectitle","Flux spectrum"));
    const box = el("div","fluxbox");
    box.innerHTML = fluxSVG(c.flux_curve);
    box.append(el("div","filemeta","&nbsp;"+esc(c.flux_curve.label||"")));
    wrap.append(box);
  }

  // AgBe calibration report, verbatim
  if(c.agbe && c.agbe.report_text){
    wrap.append(el("div","sectitle","AgBe calibration report"));
    wrap.append(codeCard(c.agbe.source || "calibration_report.txt", c.agbe.report_text));
  }

  // plots grouped by category
  const groups = [
    ["sensitivity","Sensitivity / flood"],
    ["agbe","AgBe calibration"],
    ["flux","Flux / overlays"],
    ["other","Other"],
  ];
  let anyPlot = false;
  groups.forEach(([cat,label])=>{
    const items = c.plots.filter(p=>p.category===cat);
    if(!items.length) return;
    anyPlot = true;
    wrap.append(el("div","sectitle",esc(label)));
    const g = el("div","plotgrid");
    items.forEach(p=>{
      const pc = el("div","plotcard");
      pc.append(el("div","cap",esc(p.subpath)));
      const img = el("img");
      img.loading="lazy"; img.src=p.src; img.alt=p.subpath;
      img.onclick=()=>openLightbox(p.src);
      pc.append(img);
      g.append(pc);
    });
    wrap.append(g);
  });
  if(!anyPlot && !(c.flux_curve&&c.flux_curve.x&&c.flux_curve.x.length)){
    wrap.append(el("div","empty","No plots available for this cycle. "+
      "Modern cycles (2025B onward) include QC and AgBe plots."));
  }

  if(c.readme){
    wrap.append(el("div","sectitle","Cycle README"));
    const r = el("div","readme");
    r.innerHTML = mdToHtml(c.readme);
    wrap.append(r);
  }
  return wrap;
}

/* ---------- tiny markdown renderer (headings, tables, code, lists) ---------- */
function mdInline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*]+)\*/g,"$1<em>$2</em>");
  // images before links (![alt](src) contains the []() link pattern)
  s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2" loading="lazy">');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function mdToHtml(md){
  const lines = md.replace(/\r/g,"").split("\n");
  let out=[], i=0, inCode=false, code=[];
  function flushTable(rows){
    if(rows.length<2) return rows.map(r=>"<p>"+mdInline(r)+"</p>").join("");
    const cells = r => r.replace(/^\||\|$/g,"").split("|").map(x=>x.trim());
    let h="<table><thead><tr>"+cells(rows[0]).map(c=>"<th>"+mdInline(c)+"</th>").join("")+"</tr></thead><tbody>";
    for(let k=2;k<rows.length;k++){
      h+="<tr>"+cells(rows[k]).map(c=>"<td>"+mdInline(c)+"</td>").join("")+"</tr>";
    }
    return h+"</tbody></table>";
  }
  while(i<lines.length){
    let ln = lines[i];
    if(/^```/.test(ln)){
      if(inCode){ out.push("<pre><code>"+esc(code.join("\n"))+"</code></pre>"); code=[]; inCode=false; }
      else inCode=true;
      i++; continue;
    }
    if(inCode){ code.push(ln); i++; continue; }
    // table block
    if(/\|/.test(ln) && i+1<lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]+/.test(lines[i+1])){
      let rows=[]; while(i<lines.length && /\|/.test(lines[i])){ rows.push(lines[i]); i++; }
      out.push(flushTable(rows)); continue;
    }
    let m;
    if((m=ln.match(/^(#{1,4})\s+(.*)/))){ out.push("<h"+m[1].length+">"+mdInline(m[2])+"</h"+m[1].length+">"); i++; continue; }
    if(/^\s*(---|\*\*\*|___)\s*$/.test(ln)){ out.push("<hr>"); i++; continue; }
    if(/^\s*>/.test(ln)){ out.push("<blockquote>"+mdInline(ln.replace(/^\s*>\s?/,""))+"</blockquote>"); i++; continue; }
    if(/^\s*[-*+]\s+/.test(ln)){
      let items=[]; while(i<lines.length && /^\s*[-*+]\s+/.test(lines[i])){ items.push("<li>"+mdInline(lines[i].replace(/^\s*[-*+]\s+/,""))+"</li>"); i++; }
      out.push("<ul>"+items.join("")+"</ul>"); continue;
    }
    if(/^\s*\d+\.\s+/.test(ln)){
      let items=[]; while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){ items.push("<li>"+mdInline(lines[i].replace(/^\s*\d+\.\s+/,""))+"</li>"); i++; }
      out.push("<ol>"+items.join("")+"</ol>"); continue;
    }
    if(ln.trim()===""){ i++; continue; }
    out.push("<p>"+mdInline(ln)+"</p>"); i++;
  }
  if(inCode) out.push("<pre><code>"+esc(code.join("\n"))+"</code></pre>");
  return out.join("\n");
}

/* ---------- lightbox ---------- */
function openLightbox(src){
  document.getElementById("lbimg").src = src;
  document.getElementById("lightbox").classList.add("on");
}
document.getElementById("lightbox").onclick = () =>
  document.getElementById("lightbox").classList.remove("on");

/* ---------- standards view (per cycle) ---------- */
function fmtCounts(n){
  if(n==null) return "—";
  if(n>=1e9) return (n/1e9).toFixed(2)+"B";
  if(n>=1e6) return (n/1e6).toFixed(2)+"M";
  if(n>=1e3) return (n/1e3).toFixed(1)+"k";
  return String(n);
}
function fmtDur(s){
  if(s==null) return "—";
  s=Math.round(s);
  if(s<90) return s+" s";
  if(s<5400) return Math.round(s/60)+" min";
  return (s/3600).toFixed(1)+" h";
}
function distKeyLabel(k){
  return {"4m":"4.0 m","2o5m":"2.5 m","1o3m":"1.3 m"}[k] || (k||"—");
}
function iqSVG(iq){
  // log-log I(Q)
  const W=380,H=300,m={l:52,r:12,t:12,b:38};
  const pts=[];
  for(let i=0;i<iq.q.length;i++){ if(iq.q[i]>0 && iq.I[i]>0) pts.push([Math.log10(iq.q[i]),Math.log10(iq.I[i])]); }
  if(pts.length<2) return "<div class='empty'>no positive I(Q) points to plot</div>";
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);
  const px=x=>m.l+(x-xmin)/((xmax-xmin)||1)*(W-m.l-m.r);
  const py=y=>m.t+(1-(y-ymin)/((ymax-ymin)||1))*(H-m.t-m.b);
  let d=""; pts.forEach((p,i)=> d+=(i?"L":"M")+px(p[0]).toFixed(1)+" "+py(p[1]).toFixed(1)+" ");
  let t="";
  for(let e=Math.ceil(ymin);e<=Math.floor(ymax);e++){const y=py(e);t+=`<line x1="${m.l}" y1="${y}" x2="${W-m.r}" y2="${y}" stroke="#e3e6e9"/><text x="${m.l-6}" y="${y+4}" fill="#5b6570" font-size="10" text-anchor="end">1e${e}</text>`;}
  for(let e=Math.ceil(xmin);e<=Math.floor(xmax);e++){const x=px(e);t+=`<line x1="${x}" y1="${m.t}" x2="${x}" y2="${H-m.b}" stroke="#eef0f2"/><text x="${x}" y="${H-m.b+16}" fill="#5b6570" font-size="10" text-anchor="middle">1e${e}</text>`;}
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img"><rect x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="#fbfcfc" stroke="#d3d7dc"/>${t}<path d="${d}" fill="none" stroke="#0067b9" stroke-width="1.6"/><text x="${W/2}" y="${H-6}" fill="#5b6570" font-size="11" text-anchor="middle">Q (1/Å)</text><text x="12" y="${H/2}" fill="#5b6570" font-size="11" text-anchor="middle" transform="rotate(-90 12 ${H/2})">I(Q) (1/cm)</text></svg>`;
}
const SAMPLE_COLOR={porsil:"#0067b9",porasil:"#0067b9",agbe:"#00703c",peltierwindow:"#b26a00",PMMA:"#8e44ad",blockedbeam:"#c0392b"};
const SAMPLE_ORDER=["porsil","porasil","agbe","PMMA","peltierwindow","blockedbeam"];
const SPREAD_COLOR={"0.03":"#0067b9","0.05":"#00703c","0.10":"#b26a00","0.15":"#c0392b"};
// core: overlay several labelled I(Q) curves (log-log) with a legend
function multiLineIq(raw){
  const W=520,H=360,m={l:56,r:14,t:12,b:40};
  const series=[];
  raw.forEach(s=>{
    if(!s.iq||!s.iq.q) return;
    const pts=[];
    for(let i=0;i<s.iq.q.length;i++){ if(s.iq.q[i]>0 && s.iq.I[i]>0) pts.push([Math.log10(s.iq.q[i]),Math.log10(s.iq.I[i])]); }
    if(pts.length>=2) series.push({label:s.label,pts,color:s.color||"#888"});
  });
  if(!series.length) return "<div class='empty'>no positive I(Q) to overlay</div>";
  let xmin=Infinity,xmax=-Infinity,ymin=Infinity,ymax=-Infinity;
  series.forEach(s=>s.pts.forEach(p=>{xmin=Math.min(xmin,p[0]);xmax=Math.max(xmax,p[0]);ymin=Math.min(ymin,p[1]);ymax=Math.max(ymax,p[1]);}));
  const px=x=>m.l+(x-xmin)/((xmax-xmin)||1)*(W-m.l-m.r);
  const py=y=>m.t+(1-(y-ymin)/((ymax-ymin)||1))*(H-m.t-m.b);
  let g="";
  for(let e=Math.ceil(ymin);e<=Math.floor(ymax);e++){const y=py(e);g+=`<line x1="${m.l}" y1="${y}" x2="${W-m.r}" y2="${y}" stroke="#e3e6e9"/><text x="${m.l-6}" y="${y+4}" fill="#5b6570" font-size="10" text-anchor="end">1e${e}</text>`;}
  for(let e=Math.ceil(xmin);e<=Math.floor(xmax);e++){const x=px(e);g+=`<line x1="${x}" y1="${m.t}" x2="${x}" y2="${H-m.b}" stroke="#eef0f2"/><text x="${x}" y="${H-m.b+16}" fill="#5b6570" font-size="10" text-anchor="middle">1e${e}</text>`;}
  let paths="";
  series.forEach(s=>{ let d=""; s.pts.forEach((p,i)=> d+=(i?"L":"M")+px(p[0]).toFixed(1)+" "+py(p[1]).toFixed(1)+" "); paths+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.6"/>`; });
  let leg=`<rect x="${W-m.r-108}" y="${m.t+4}" width="106" height="${series.length*15+6}" fill="#ffffffdd" stroke="#d3d7dc"/>`;
  series.forEach((s,i)=>{ const ly=m.t+15+i*15; leg+=`<line x1="${W-m.r-100}" y1="${ly}" x2="${W-m.r-84}" y2="${ly}" stroke="${s.color}" stroke-width="2.6"/><text x="${W-m.r-80}" y="${ly+3.5}" fill="#1f2328" font-size="10.5">${esc(s.label)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img"><rect x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="#fbfcfc" stroke="#d3d7dc"/>${g}${paths}${leg}<text x="${W/2}" y="${H-6}" fill="#5b6570" font-size="11" text-anchor="middle">Q (1/Å)</text><text x="12" y="${H/2}" fill="#5b6570" font-size="11" text-anchor="middle" transform="rotate(-90 12 ${H/2})">I(Q) (1/cm)</text></svg>`;
}
function overlaySVG(items){   // one config, all samples overlaid
  return multiLineIq(items.slice()
    .sort((a,b)=>(SAMPLE_ORDER.indexOf(a.sample)+1||99)-(SAMPLE_ORDER.indexOf(b.sample)+1||99))
    .map(it=>({label:it.sample, color:SAMPLE_COLOR[it.sample]||"#888", iq:it.iq})));
}
function stdCard(d){
  const card=el("div","stdcard");
  const cap=el("div","cap");
  cap.append(el("b","",esc(d.sample)), el("span","cfg",esc(d.config||"")));
  card.append(cap);
  const info=el("div","stdinfo");
  [["run", d.run!=null?String(d.run):"—"],
   ["dist", distKeyLabel(d.dist)],
   ["λ", d.wl!=null?d.wl+" Å":"—"],
   ["counts", fmtCounts(d.total_counts)],
   ["duration", fmtDur(d.duration)]
  ].forEach(([k,v]) => info.append(el("span","","<b>"+esc(v)+"</b> "+esc(k))));
  card.append(info);
  const pair=el("div","stdpair");
  const d1=el("div"); d1.append(el("div","lbl","1D  I(Q)"));
  const hasPos = d.iq && d.iq.q && d.iq.I && d.iq.I.some((v,i)=>v>0 && d.iq.q[i]>0);
  if(hasPos){ const sv=el("div"); sv.innerHTML=iqSVG(d.iq); d1.append(sv); }
  else if(d.error){ d1.append(el("div","stderr","⚠ no I(Q) plot — "+esc(d.error))); }
  else if(d.iq_png_src){ const im=el("img"); im.src=d.iq_png_src; im.onclick=()=>openLightbox(d.iq_png_src); d1.append(im); }
  else d1.append(el("div","empty","no positive I(Q) to plot"));
  const d2=el("div","div2d"); d2.append(el("div","lbl","2D  I(Qx,Qy)"));
  if(d.iqxqy_src){ const im=el("img"); im.loading="lazy"; im.src=d.iqxqy_src; im.onclick=()=>openLightbox(d.iqxqy_src); d2.append(im); }
  else d2.append(el("div","empty","no 2D image"));
  pair.append(d1,d2);
  card.append(pair);
  return card;
}
function varyspreadSection(c, wrap){
  // monochromatic standard samples vs beam spread (dl/l); one card per sample
  const vs=(c.varyspread||[]);
  if(!vs.length) return;
  const ok=vs.filter(d=>d.iq && d.iq.I && d.iq.I.some((v,i)=>v>0 && d.iq.q[i]>0)).length;
  wrap.append(el("div","sectitle","Monochromatic spread series (dl/l · 4 m, 2.5 Å)"));
  wrap.append(el("div","sub", vs.length+" datasets — same sample vs monochromatic beam spread; "+
    ok+" produced I(Q)."+(ok<vs.length?" See chopper.md for the monochromatic-reduction issue.":"")));
  const bySample={};
  vs.forEach(d=>{ (bySample[d.sample]=bySample[d.sample]||[]).push(d); });
  const grid=el("div","stdgrid");
  Object.keys(bySample).sort((a,b)=>(SAMPLE_ORDER.indexOf(a)+1||99)-(SAMPLE_ORDER.indexOf(b)+1||99))
    .forEach(sample=>{
      const items=bySample[sample].slice().sort((a,b)=>parseFloat(a.spread)-parseFloat(b.spread));
      const card=el("div","stdcard");
      const cap=el("div","cap"); cap.append(el("b","",esc(sample)), el("span","cfg","4 m · 2.5 Å")); card.append(cap);
      const withiq=items.filter(d=>d.iq && d.iq.I && d.iq.I.some((v,i)=>v>0 && d.iq.q[i]>0));
      if(withiq.length>=2){
        const box=el("div","ovbox");
        box.innerHTML=multiLineIq(withiq.map(d=>({label:"dl "+d.spread, color:SPREAD_COLOR[d.spread]||"#888", iq:d.iq})));
        card.append(box);
      }
      const info=el("div","maskinfo");
      items.forEach(d=>{
        const row=el("div","mrow");
        row.append(el("span","mk","dl/l "+esc(d.spread)),
          el("span","mv","run "+(d.run!=null?d.run:"—")+" · "+fmtCounts(d.total_counts)+" · "+fmtDur(d.duration)));
        info.append(row);
        if(!(d.iq && d.iq.I && d.iq.I.some((v,i)=>v>0 && d.iq.q[i]>0)) && d.error)
          info.append(el("div","stderr","⚠ "+esc(d.error)));
      });
      card.append(info);
      grid.append(card);
    });
  wrap.append(grid);
}
function renderStandards(c){
  const wrap=el("div");
  const head=el("div","cyclehead");
  head.append(el("h2","","Standard samples"), el("span","badge","Cycle "+esc(c.id)));
  wrap.append(head);
  const std=c.standards||[];
  if(!std.length){
    wrap.append(el("div","sub","Reduced standard-sample results for this cycle."));
    wrap.append(el("div","empty","No standard-sample reductions published for this cycle yet. "+
      "Reduce them in "+esc(c.folder)+"/reduction/, run tools/reduce/report_standards.py, then update the page."));
    return wrap;
  }
  wrap.append(el("div","sub",std.length+" reduced datasets · porsil & agbe are banjo-subtracted; blockedbeam & peltierwindow have no background."));

  // --- overlay per configuration: all samples in one plot ---
  const distOrder={"4m":0,"2o5m":1,"1o3m":2};
  const byConfig={};
  std.forEach(d=>{ (byConfig[d.config]=byConfig[d.config]||[]).push(d); });
  const configs=Object.keys(byConfig).sort((a,b)=>{
    const da=byConfig[a][0], db=byConfig[b][0];
    return ((distOrder[da.dist]??9)-(distOrder[db.dist]??9)) || ((da.wl||0)-(db.wl||0));
  });
  wrap.append(el("div","sectitle","By configuration — all samples overlaid"));
  const ogrid=el("div","stdgrid");
  configs.forEach(cf=>{
    const d0=byConfig[cf][0];
    const card=el("div","stdcard");
    const cap=el("div","cap");
    const cfgSpan=el("span","cfg");
    cfgSpan.textContent=distKeyLabel(d0.dist)+" · "+(d0.wl!=null?d0.wl+" Å":"");
    cap.append(el("b","",esc(cf)), cfgSpan);
    card.append(cap);
    const box=el("div","ovbox"); box.innerHTML=overlaySVG(byConfig[cf]);
    card.append(box);
    ogrid.append(card);
  });
  wrap.append(ogrid);

  const order=["porsil","agbe","blockedbeam","peltierwindow"];
  const bySample={};
  std.forEach(d=>{ (bySample[d.sample]=bySample[d.sample]||[]).push(d); });
  Object.keys(bySample).sort((a,b)=>{
    const ia=order.indexOf(a), ib=order.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b);
  }).forEach(sample=>{
    wrap.append(el("div","sectitle",esc(sample)));
    const grid=el("div","stdgrid");
    bySample[sample].slice().sort((a,b)=>(a.config||"").localeCompare(b.config||""))
      .forEach(d=>grid.append(stdCard(d)));
    wrap.append(grid);
  });
  varyspreadSection(c, wrap);
  return wrap;
}

/* ---------- masks view (per cycle) ---------- */
function renderMasks(c){
  const wrap=el("div");
  const head=el("div","cyclehead");
  head.append(el("h2","","Detector masks"), el("span","badge","Cycle "+esc(c.id)));
  wrap.append(head);
  const masks=c.masks||[];
  if(!masks.length){
    wrap.append(el("div","sub","Detector masks for this cycle."));
    wrap.append(el("div","empty","No masks published for this cycle. Make one with "+
      "tools/mask/make_mask.py (skill /eqsans-mask)."));
    return wrap;
  }
  wrap.append(el("div","sub",masks.length+" mask(s) — left: raw counts; right: mask overlay (red)."));
  masks.forEach(m=>{
    wrap.append(el("div","sectitle","run "+esc(m.run||"?")+(m.config?" · "+esc(m.config):"")));
    const card=el("div","card");
    const info=el("div","maskinfo");
    const beam = m.beam ? ("rx="+m.beam.rx+" tubes, ry="+m.beam.ry+" px  (scale "+
                 m.beam_scale+", pad "+m.beam_pad+" px)") : "—";
    const bands = (m.top!=null?m.top:"—")+" / "+(m.bottom!=null?m.bottom:"—")+" pixels";
    const tubes = (m.tubes&&m.tubes.length) ? m.tubes.join(", ")+" ("+(m.tube_source||"")+")" : "none";
    [["run", m.run],
     ["config", m.config],
     ["mask file", m.mask_path],
     ["prepared by", m.script],
     ["beam circle", beam],
     ["top / bottom band", bands],
     ["tubes masked", tubes],
     ["pixels masked", m.n_masked],
     ["command", m.command]
    ].forEach(([k,v])=>{
      const r=el("div","mrow");
      r.append(el("span","mk",esc(k)), el("span","mv",esc(v==null?"—":String(v))));
      info.append(r);
    });
    card.append(info);
    if(m.compare_src){
      const box=el("div","maskimg");
      const im=el("img"); im.loading="lazy"; im.src=m.compare_src; im.alt="mask "+(m.run||"");
      im.onclick=()=>openLightbox(m.compare_src);
      box.append(im); card.append(box);
    }
    wrap.append(card);
  });
  return wrap;
}

/* ---------- choppers view (instrument-level) ---------- */
function renderChoppers(){
  const wrap = el("div");
  const head = el("div","cyclehead");
  head.append(el("h2","","Chopper system"));
  head.append(el("span","badge latest","6-chopper · since 2026B"));
  wrap.append(head);
  wrap.append(el("div","sub","Instrument-level configuration — applies from the 2026B cycle onward, independent of the selected cycle."));
  if(D.chopper_md){
    const r = el("div","readme");
    r.innerHTML = mdToHtml(D.chopper_md);
    wrap.append(r);
  } else {
    wrap.append(el("div","empty","No chopper documentation found. Add doc/chopper.md and regenerate."));
  }
  return wrap;
}

/* ---------- shell ---------- */
function render(){
  const main = document.getElementById("main");
  main.innerHTML = "";
  if(view==="choppers"){ main.append(renderChoppers()); return; }

  const c = byId[current];
  if(!c){ main.append(el("div","empty","No cycle data. Run generate.py.")); return; }

  const head = el("div","cyclehead");
  head.append(el("h2","","Cycle "+esc(c.id)));
  if(D.cycles[0] && D.cycles[0].id===c.id) head.append(el("span","badge latest","most recent"));
  if(c.ipts) head.append(el("span","badge","IPTS-"+esc(c.ipts)));
  if(c.agbe && c.agbe.partial) head.append(el("span","badge warn","AgBe in progress"));
  main.append(head);

  const sub = el("div","sub");
  sub.append(document.createTextNode(c.folder+" · updated "+(c.mtime||"?")+" · "));
  const pth = el("span","", esc(c.path)); pth.style.fontFamily="var(--mono)";
  sub.append(pth);
  main.append(sub);

  main.append(view === "standards" ? renderStandards(c)
            : view === "masks" ? renderMasks(c)
            : view === "details" ? renderDetails(c)
            : renderSummary(c));
}

function buildSelect(){
  const sel = document.getElementById("cycle");
  D.cycles.forEach(c=>{
    const o = el("option"); o.value=c.id;
    o.textContent = c.id + (D.cycles[0].id===c.id ? "  (latest)" : "");
    sel.append(o);
  });
  sel.value = current;
  sel.onchange = () => { current = sel.value; render(); };
}
document.getElementById("tabs").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  view = b.dataset.view;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("active",x===b));
  render();
});

document.getElementById("genstamp").textContent = "Generated "+(D.generated||"—");
document.getElementById("rootpath").textContent = D.display_root||"";
buildSelect();
render();
</script>
